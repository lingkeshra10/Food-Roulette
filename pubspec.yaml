name: food_roulette
description: Food Roulette - A mobile app to help users decide where to eat by randomly selecting from personalized food shop lists organized by meal categories.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.16.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  shared_preferences: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  glados: ^1.1.1
  flutter_lints: ^1.0.0

flutter:
  uses-material-design: true
